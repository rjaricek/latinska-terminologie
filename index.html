          React.useEffect(() => {
            if (ref.current) {
              ref.current.innerHTML = '';
              const iconSvg = window.lucide.createIcons({
                icons: { [name]: window.lucide.icons[name] },
                nameAttr: 'data-lucide'
              });
            }
          }, []);
          return <i ref={ref} data-lucide={name} className={props.className || ''}></i>;

            <p>Samohlásky mohou být krátké (a, e, i, o, u, y) a dlouhé (ā, ē, ī, ō, ū, ý). Dvojhlásky <strong>ae, oe</strong> čteme jako dlouhé <em>é</em>.</p>

        )

        id: 'lekce-2',

          <div className="space-y-4">

          </div>
        )

    // --- MAIN APP COMPONENT ---

      const [dictSearch, setDictSearch] = useState('');
      
      const [knownWords, setKnownWords] = useState({});

      useEffect(() => {
        try {
          const savedWords = localStorage.getItem('latinaKnownWords');
          if (savedWords) setKnownWords(JSON.parse(savedWords));
        } catch (e) {
          console.error(e);
        }
      }, []);

      const updateKnownWords = (word, isKnown) => {
        const updated = { ...knownWords, [word]: isKnown };
        setKnownWords(updated);
        try {
          localStorage.setItem('latinaKnownWords', JSON.stringify(updated));
        } catch (e) {}
      };

      return (

                <div>
                  <h1 className="text-lg font-bold text-white leading-tight">Lékařská Latina</h1>
                  <span className="text-xs text-slate-400">Učebnice</span>
                </div>
              </div>
            </div>

              </button>
              <button onClick={() => setCurrentSection('practice')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${currentSection === 'practice' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}`}>
                <Dumbbell /> <span className="font-medium">Kartičky & Kvíz</span>
              </button>
              <button onClick={() => setCurrentSection('dictionary')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${currentSection === 'dictionary' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800'}`}>
                <ListFilter /> <span className="font-medium">Slovníček</span>
              </button>
            </nav>
          </aside>

                <h2 className="text-3xl font-bold">Vítejte ve studiu lékařské latiny</h2>
                <div className="bg-white p-6 rounded-xl border shadow-sm">
                  <h3 className="text-xl font-bold mb-2">Stav naučených slovíček</h3>
                  <p className="text-4xl font-extrabold text-teal-600 my-2">
                    {Object.values(knownWords).filter(Boolean).length} / {vocabDatabase.length}

                </div>
              </div>
            )}

                    <tbody className="divide-y">

                        <tr key={i}><td className="p-4 font-semibold">{v.latin}</td><td className="p-4 text-teal-700">{v.czech}</td><td className="p-4 text-sm text-slate-500">{v.cat}</td></tr>

                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );

    function FlashcardsModule({ vocab, knownWords, updateKnownWords }) {
      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);

      if (!vocab || vocab.length === 0) return <div>Žádná slovíčka.</div>;
      const w = vocab[idx];

      return (
        <div className="max-w-md mx-auto text-center space-y-6">
          <div onClick={() => setFlipped(!flipped)} className="bg-white p-12 rounded-2xl border shadow-lg cursor-pointer min-h-[200px] flex flex-col justify-center items-center">
            <span className="text-xs font-bold text-slate-400 mb-2">{flipped ? 'ČESKÝ PŘEKLAD' : 'LATINSKÝ VÝRAZ'}</span>
            <h2 className="text-3xl font-extrabold">{flipped ? w.czech : w.latin}</h2>
            <span className="text-xs text-slate-400 mt-4">Kliknutím otoč</span>
          </div>
          <div className="flex gap-4">
            <button onClick={() => { updateKnownWords(w.latin, false); setIdx((idx + 1) % vocab.length); setFlipped(false); }} className="flex-1 py-3 bg-rose-100 text-rose-700 font-bold rounded-xl">Neznám</button>
            <button onClick={() => { updateKnownWords(w.latin, true); setIdx((idx + 1) % vocab.length); setFlipped(false); }} className="flex-1 py-3 bg-emerald-100 text-emerald-700 font-bold rounded-xl">Znám</button>
          </div>
        </div>
      );
    }

    // Korektní načtení v Reactu 18
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
