<!DOCTYPE html>
<html lang="cs">

</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- BEZPEČNÉ SVG IKONY ---

      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>

      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>

    );
    const XCircle = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const BrainCircuit = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
    );
    const RotateCcw = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    );
    const ChevronRight = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"/></svg>
    );
    const ChevronLeft = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"/></svg>
    );
    const Trophy = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2 0h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
    );
    const Dumbbell = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"/></svg>
    );
    const Stethoscope = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
    );
    const ListFilter = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
    );
    const Info = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const CheckSquare = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    );
    const Edit3 = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 4H4a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-7M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    );
    const RefreshCw = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    );

    // --- DATABÁZE DOPLŇOVACÍCH CVIČENÍ ---
    const fillInDatabase = [
      {
        cat: 'Lekce II: 1. Deklinace',
        sentence: "Pharmacopola parat medicamentum pro ___.",
        baseWord: "aegrota, ae, f.",
        correct: "aegrota",
        options: ["aegrota", "aegrotam", "aegrotae", "aegrotas"],
        translation: "Lékárník připravuje lék pro nemocnou."
      },
      {
        cat: 'Lekce II: 1. Deklinace',
        sentence: "Fractura ___ dextrae.",
        baseWord: "fibula, ae, f.",
        correct: "fibulae",
        options: ["fibulae", "fibulam", "fibula", "fibulārum"],
        translation: "Zlomenina pravé lýtkové kosti."
      },
      {
        cat: 'Lekce II: 1. Deklinace',
        sentence: "Aegrota patitur ___ pulmonum.",
        baseWord: "pneumonia, ae, f.",
        correct: "pneumoniam",
        options: ["pneumoniam", "pneumonia", "pneumoniae", "pneumonias"],
        translation: "Nemocná trpí zápalem plic."
      },
      {
        cat: 'Lekce III: 2. Deklinace',
        sentence: "Agericus patitur morbum ___.",
        baseWord: "acutus, a, um",
        correct: "acutum",
        options: ["acutum", "acuti", "acuto", "acuta"],
        translation: "Pacient trpí akutní nemocí."
      },
      {
        cat: 'Lekce III: 2. Deklinace',
        sentence: "Medicamentum in ___ datur.",
        baseWord: "vitrum, i, n.",
        correct: "vitro",
        options: ["vitro", "vitrum", "vitri", "vitra"],
        translation: "Lék se dává do lahvičky."
      },
      {
        cat: 'Lekce III: 2. Deklinace',
        sentence: "Spasmus ___ ventris.",
        baseWord: "musculus, i, m.",
        correct: "musculorum",
        options: ["musculorum", "musculi", "musculos", "musculo"],
        translation: "Křeč břišních svalů."
      },
      {
        cat: 'Lekce IV: Adjektiva 1. a 2. dekl.',
        sentence: "Fractura ossis ___.",
        baseWord: "open / apertus, a, um",
        correct: "aperta",
        options: ["aperta", "apertum", "aperti", "apertae"],
        translation: "Otevřená zlomenina kosti."
      },
      {
        cat: 'Lekce V: 3. Deklinace',
        sentence: "Aegrotus habet dolores ___.",
        baseWord: "caput, itis, n.",
        correct: "capitis",
        options: ["capitis", "caput", "capite", "capitum"],
        translation: "Nemocný má bolesti hlavy."
      },
      {
        cat: 'Lekce VII: 4. Deklinace',
        sentence: "Status post ___ cordis.",
        baseWord: "infarctus, us, m.",
        correct: "infarctum",
        options: ["infarctum", "infarctus", "infarctu", "infarctui"],
        translation: "Stav po infarktu myokardu."
      }
    ];

    // --- DATABÁZE SLOVÍČEK ---
    const vocabDatabase = [
      { cat: 'Lekce II: 1. Deklinace', latin: 'angina, ae, f.', czech: 'angina' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'anomalia, ae, f.', czech: 'zvláštnost, odlišnost' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'aorta, ae, f.', czech: 'srdečnice, aorta' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'aqua, ae, f.', czech: 'voda' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'arteria, ae, f.', czech: 'tepna, artérie' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'clavicula, ae, f.', czech: 'klíční kost' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'costa, ae, f.', czech: 'žebro' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'fibula, ae, f.', czech: 'lýtková kost' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'fractura, ae, f.', czech: 'zlomenina' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'glandula, ae, f.', czech: 'žláza' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'lingua, ae, f.', czech: 'jazyk' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'pneumonia, ae, f.', czech: 'zápal plic' },
      { cat: 'Lekce II: 1. Deklinace', latin: 'vertebra, ae, f.', czech: 'obratel' },

      { cat: 'Lekce III: 2. Deklinace', latin: 'acidum, i, n.', czech: 'kyselina' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'aegrotus, i, m.', czech: 'nemocný' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'cancer, cri, m.', czech: 'rakovina' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'cavum, i, n.', czech: 'dutina' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'cerebrum, i, n.', czech: 'mozek' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'digitus, i, m.', czech: 'prst' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'humerus, i, m.', czech: 'pažní kost' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'morbus, i, m.', czech: 'nemoc' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'musculus, i, m.', czech: 'sval' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'nervus, i, m.', czech: 'nerv' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'oculus, i, m.', czech: 'oko' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'ventriculus, i, m.', czech: 'žaludek, srdeční komora' },
      { cat: 'Lekce III: 2. Deklinace', latin: 'virus, i, n.', czech: 'virus' },

      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'acutus, a, um', czech: 'akutní, prudký' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'benignus, a, um', czech: 'nezhoubný, benigní' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'chronicus, a, um', czech: 'vleklý, chronický' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'dexter, tra, trum', czech: 'pravý' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'infectiosus, a, um', czech: 'infekční' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'malignus, a, um', czech: 'zhoubný, maligní' },
      { cat: 'Lekce IV: Adjektiva 1. a 2. dekl.', latin: 'sinister, tra, trum', czech: 'levý' },

      { cat: 'Lekce V: 3. Deklinace', latin: 'caput, itis, n.', czech: 'hlava' },
      { cat: 'Lekce V: 3. Deklinace', latin: 'cor, cordis, n.', czech: 'srdce' },
      { cat: 'Lekce V: 3. Deklinace', latin: 'dolor, oris, m.', czech: 'bolest' },
      { cat: 'Lekce V: 3. Deklinace', latin: 'pulmo, onis, m.', czech: 'plíce' },

      { cat: 'Lekce VII: 4. Deklinace', latin: 'infarctus, us, m.', czech: 'infarkt' },
      { cat: 'Lekce VII: 4. Deklinace', latin: 'manus, us, f.', czech: 'ruka' },
      { cat: 'Lekce VII: 4. Deklinace', latin: 'status, us, m.', czech: 'stav' }
    ];

    const allCategoriesList = [...new Set(vocabDatabase.map(v => v.cat))];

    // --- HLAVNÍ KOMPONENTA ---
    function App() {
      const [currentSection, setCurrentSection] = useState('dashboard');
      const [selectedCategories, setSelectedCategories] = useState(allCategoriesList);
      const [practiceMode, setPracticeMode] = useState('flashcards');
      const [knownWords, setKnownWords] = useState({});

      useEffect(() => {
        try {
          const savedWords = localStorage.getItem('latinaKnownWords');
          if (savedWords) setKnownWords(JSON.parse(savedWords));
        } catch (e) {}
      }, []);

      const updateKnownWords = (word, isKnown) => {
        const updated = { ...knownWords, [word]: isKnown };
        setKnownWords(updated);
        try {
          localStorage.setItem('latinaKnownWords', JSON.stringify(updated));
        } catch (e) {}
      };

      const toggleCategory = (cat) => {
        if (selectedCategories.includes(cat)) {
          if (selectedCategories.length > 1) {
            setSelectedCategories(selectedCategories.filter(c => c !== cat));
          }
        } else {
          setSelectedCategories([...selectedCategories, cat]);
        }
      };

      const navItems = [
        { id: 'dashboard', label: 'Přehled', icon: LayoutDashboard },
        { id: 'practice', label: 'Cvičení & Kartičky', icon: Dumbbell },
        { id: 'dictionary', label: 'Slovník', icon: ListFilter },
      ];

      return (
        <div className="flex flex-col md:flex-row h-screen bg-slate-50 font-sans text-slate-800 overflow-hidden">
          <style dangerouslySetInnerHTML={{__html: `
            .perspective-1000 { perspective: 1000px; }
            .transform-style-3d { transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
            .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
            .rotate-y-180 { transform: rotateY(180deg); }
          `}} />

          {/* DESKTOP SIDEBAR */}
          <aside className="hidden md:flex w-64 bg-slate-900 text-slate-300 flex-col shadow-xl shrink-0">
            <div className="p-6 bg-slate-950 flex items-center gap-3 border-b border-slate-800">
              <Stethoscope className="w-8 h-8 text-teal-500" />
              <div>
                <h1 className="text-lg font-bold text-white leading-tight">PhysioMetrics</h1>
                <span className="text-xs text-teal-400 font-semibold">Lékařská latina</span>
              </div>
            </div>

            <nav className="flex-1 p-4 space-y-2">
              {navItems.map(item => {
                const Icon = item.icon;
                return (
                  <button 
                    key={item.id} 
                    onClick={() => setCurrentSection(item.id)} 
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-colors text-sm font-medium ${currentSection === item.id ? 'bg-teal-600 text-white' : 'hover:bg-slate-800 hover:text-white'}`}
                  >
                    <Icon className="w-5 h-5" /> {item.label}
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* HLAVNÍ OBSAH */}
          <main className="flex-1 overflow-y-auto p-4 md:p-8">
            {currentSection === 'dashboard' && (
              <Dashboard knownWords={knownWords} setSection={setCurrentSection} />
            )}
            {currentSection === 'practice' && (
              <PracticeView 
                mode={practiceMode}
                setMode={setPracticeMode}
                selectedCategories={selectedCategories} 
                toggleCategory={toggleCategory}
                setSelectedCategories={setSelectedCategories}
                knownWords={knownWords} 
                updateKnownWords={updateKnownWords} 
              />
            )}
            {currentSection === 'dictionary' && (
              <DictionaryView />
            )}
          </main>
        </div>
      );
    }

    // --- DASHBOARD ---
    function Dashboard({ knownWords, setSection }) {
      const totalWords = vocabDatabase.length;
      const learnedWords = Object.values(knownWords).filter(Boolean).length;
      const progressPercent = Math.round((learnedWords / totalWords) * 100) || 0;

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <h2 className="text-3xl font-bold text-slate-900">Přehled studia</h2>
          <div className="bg-gradient-to-br from-teal-900 to-slate-800 text-white p-6 rounded-2xl shadow-md space-y-4">
            <div className="flex items-center gap-4">
              <BrainCircuit className="w-10 h-10 text-teal-400 shrink-0" />
              <div>
                <h3 className="text-base font-semibold text-slate-200">Naučená slovíčka</h3>
                <p className="text-3xl font-bold">{learnedWords} / {totalWords}</p>
              </div>
            </div>
            <div className="w-full bg-slate-700 rounded-full h-3">
              <div className="bg-teal-400 h-3 rounded-full transition-all duration-500" style={{ width: `${progressPercent}%` }}></div>
            </div>
          </div>
          <button onClick={() => setSection('practice')} className="w-full py-4 bg-teal-600 text-white font-bold rounded-2xl shadow-md hover:bg-teal-700 transition">
            Spustit cvičení
          </button>
        </div>
      );
    }

    // --- PRACTICE VIEW ---
    function PracticeView({ mode, setMode, selectedCategories, toggleCategory, setSelectedCategories, knownWords, updateKnownWords }) {
      const [customVocab, setCustomVocab] = useState(null);

      const activeVocab = customVocab || vocabDatabase.filter(v => selectedCategories.includes(v.cat));

      return (
        <div className="max-w-2xl mx-auto space-y-6 flex flex-col items-center">
          {/* MÓDY CVIČENÍ */}
          <div className="flex bg-white p-1.5 rounded-2xl border w-full justify-between shadow-sm">
            <button onClick={() => setMode('flashcards')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition ${mode === 'flashcards' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>Kartičky</button>
            <button onClick={() => setMode('fillin')} className={`flex-1 py-2.5 rounded-xl text-sm font-bold transition ${mode === 'fillin' ? 'bg-teal-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}`}>Doplňování</button>
          </div>

          {/* VOLBA LEKCÍ (MULTI-SELECT) */}
          <div className="w-full bg-white p-4 rounded-2xl border shadow-sm space-y-3">
            <div className="flex justify-between items-center">
              <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Vybrané lekce pro zkoušení:</span>
              <button onClick={() => { setCustomVocab(null); setSelectedCategories(allCategoriesList); }} className="text-xs text-teal-600 hover:underline font-semibold">Vybrat vše</button>
            </div>
            <div className="flex flex-wrap gap-2">
              {allCategoriesList.map(cat => {
                const isSelected = selectedCategories.includes(cat) && !customVocab;
                return (
                  <button
                    key={cat}
                    onClick={() => { setCustomVocab(null); toggleCategory(cat); }}
                    className={`px-3 py-1.5 rounded-xl text-xs font-semibold transition ${isSelected ? 'bg-teal-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                  >
                    {cat}
                  </button>
                );
              })}
            </div>
          </div>

          {mode === 'flashcards' ? (
            <FlashcardsModule 
              vocab={activeVocab} 
              knownWords={knownWords} 
              updateKnownWords={updateKnownWords}
              onFilterUnknown={(unknownList) => setCustomVocab(unknownList)}
              resetCustomVocab={() => setCustomVocab(null)}
            />
          ) : (
            <FillInModule selectedCategories={selectedCategories} />
          )}
        </div>
      );
    }

    // --- MODUL DOPLŇOVÁNÍ (S NÁHODNÝM PROHÁZENÍM) ---
    function FillInModule({ selectedCategories }) {
      const [items, setItems] = useState([]);
      const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);

      const loadQuestions = () => {
        const filtered = fillInDatabase.filter(f => selectedCategories.includes(f.cat));
        const shuffled = [...filtered].sort(() => 0.5 - Math.random());
        setItems(shuffled);
        setQIdx(0);
        setScore(0);
        setSelectedAnswer(null);
      };

      useEffect(() => {
        loadQuestions();
      }, [selectedCategories]);

      if (items.length === 0) {
        return <div className="p-8 text-center text-slate-500 bg-white rounded-2xl border w-full">Pro vybranou kombinaci lekcí zatím nejsou dostupné doplňovací věty. Vyberte další lekce.</div>;
      }

      const handleOptionClick = (opt) => {
        if (selectedAnswer !== null) return;
        setSelectedAnswer(opt);

        if (opt === items[qIdx].correct) {
          setScore(prev => prev + 1);
        }

        setTimeout(() => {
          setQIdx(prev => prev + 1);
          setSelectedAnswer(null);
        }, 1200);
      };

      if (qIdx >= items.length) {
        return (
          <div className="text-center p-8 bg-white rounded-3xl border w-full shadow-lg space-y-4">
            <Trophy className="w-12 h-12 text-amber-500 mx-auto" />
            <h2 className="text-2xl font-bold">Doplňování dokončeno!</h2>
            <p className="text-lg text-slate-600">Váš výsledek: <span className="font-bold text-slate-900">{score} z {items.length}</span> ({Math.round((score / items.length) * 100)}%)</p>
            <button onClick={loadQuestions} className="w-full py-3.5 bg-slate-900 text-white font-bold rounded-2xl hover:bg-slate-800 transition">Spustit znova</button>
          </div>
        );
      }

      const q = items[qIdx];

      return (
        <div className="w-full space-y-4">
          <div className="flex justify-between items-center text-xs font-bold text-slate-400 uppercase px-2">
            <span>Věta {qIdx + 1} / {items.length}</span>
            <button onClick={loadQuestions} className="flex items-center gap-1 text-teal-600 hover:underline font-bold">
              <RefreshCw className="w-3.5 h-3.5" /> Náhodně proházet
            </button>
            <span>Skóre: {score}</span>
          </div>

          <div className="bg-white p-6 rounded-3xl border shadow-sm text-center space-y-3">
            <span className="text-xs text-teal-600 font-semibold uppercase tracking-wider">Doplňte správný tvar slova:</span>
            <h2 className="text-xl sm:text-2xl font-extrabold text-slate-900 leading-relaxed">
              {q.sentence.replace('___', '_____')}
            </h2>
            <p className="text-sm font-medium text-slate-500">Základní tvar: <span className="font-bold text-teal-700">{q.baseWord}</span></p>
            <p className="text-xs text-slate-400 italic">Překlad: "{q.translation}"</p>
          </div>

          <div className="grid grid-cols-2 gap-3">
            {q.options.map((opt, i) => {
              let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-teal-400";
              
              if (selectedAnswer !== null) {
                if (opt === q.correct) {
                  btnStyle = "bg-emerald-500 border-2 border-emerald-600 text-white font-bold shadow-md";
                } else if (opt === selectedAnswer) {
                  btnStyle = "bg-rose-500 border-2 border-rose-600 text-white font-bold shadow-md";
                } else {
                  btnStyle = "bg-slate-50 border-2 border-slate-100 text-slate-300 opacity-50";
                }
              }

              return (
                <button 
                  key={i} 
                  onClick={() => handleOptionClick(opt)} 
                  disabled={selectedAnswer !== null} 
                  className={`p-4 rounded-2xl text-base text-center font-bold transition-all ${btnStyle}`}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // --- FLASHCARDS MODULE WITH EVALUATION & BACK BUTTON ---
    function FlashcardsModule({ vocab, knownWords, updateKnownWords, onFilterUnknown, resetCustomVocab }) {
      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [sessionStats, setSessionStats] = useState({ known: [], unknown: [] });
      const [isFinished, setIsFinished] = useState(false);

      useEffect(() => {
        setIdx(0);
        setFlipped(false);
        setSessionStats({ known: [], unknown: [] });
        setIsFinished(false);
      }, [vocab]);

      if (!vocab || vocab.length === 0) {
        return <div className="p-8 text-center text-slate-500 bg-white rounded-2xl border w-full">Žádná slovíčka k dispozici. Vyberte lekci.</div>;
      }

      const currentWord = vocab[idx];

      const handleAnswer = (isKnown) => {
        updateKnownWords(currentWord.latin, isKnown);

        const updatedKnown = isKnown 
          ? [...sessionStats.known.filter(w => w.latin !== currentWord.latin), currentWord]
          : sessionStats.known.filter(w => w.latin !== currentWord.latin);

        const updatedUnknown = !isKnown
          ? [...sessionStats.unknown.filter(w => w.latin !== currentWord.latin), currentWord]
          : sessionStats.unknown.filter(w => w.latin !== currentWord.latin);

        setSessionStats({ known: updatedKnown, unknown: updatedUnknown });

        if (idx + 1 < vocab.length) {
          setIdx(idx + 1);
          setFlipped(false);
        } else {
          setIsFinished(true);
        }
      };

      const handlePrev = () => {
        if (idx > 0) {
          setIdx(idx - 1);
          setFlipped(false);
        }
      };

      const restartSession = () => {
        resetCustomVocab();
        setIdx(0);
        setFlipped(false);
        setSessionStats({ known: [], unknown: [] });
        setIsFinished(false);
      };

      if (isFinished) {
        return (
          <div className="w-full bg-white p-8 rounded-3xl border shadow-lg text-center space-y-6">
            <Trophy className="w-12 h-12 text-amber-500 mx-auto" />
            <h2 className="text-2xl font-bold text-slate-900">Procvičování dokončeno!</h2>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                <span className="block text-2xl font-extrabold text-emerald-700">{sessionStats.known.length}</span>
                <span className="text-xs font-semibold text-emerald-800 uppercase">Zvládnutá</span>
              </div>
              <div className="bg-rose-50 border border-rose-200 p-4 rounded-2xl">
                <span className="block text-2xl font-extrabold text-rose-700">{sessionStats.unknown.length}</span>
                <span className="text-xs font-semibold text-rose-800 uppercase">K procvičení</span>
              </div>
            </div>

            <div className="space-y-3 pt-4 border-t">
              {sessionStats.unknown.length > 0 && (
                <button 
                  onClick={() => onFilterUnknown(sessionStats.unknown)} 
                  className="w-full py-3.5 bg-rose-600 text-white font-bold rounded-2xl shadow-md hover:bg-rose-700 transition"
                >
                  Procvičit jen neznámá ({sessionStats.unknown.length})
                </button>
              )}
              <button 
                onClick={restartSession} 
                className="w-full py-3.5 bg-slate-900 text-white font-bold rounded-2xl shadow-md hover:bg-slate-800 transition flex items-center justify-center gap-2"
              >
                <RefreshCw className="w-4 h-4" /> Spustit znovu
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="w-full flex flex-col items-center">
          <div className="w-full flex justify-between items-center text-xs font-bold text-slate-400 mb-4 px-2">
            <button 
              onClick={handlePrev} 
              disabled={idx === 0} 
              className={`flex items-center gap-1 font-semibold ${idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-teal-600'}`}
            >
              <ChevronLeft className="w-4 h-4" /> Zpět
            </button>
            <span>Kartička {idx + 1} z {vocab.length}</span>
            <span>{knownWords[currentWord.latin] ? '✓ Znám' : 'Neprohlédnuto'}</span>
          </div>

          <div className="w-full aspect-[3/2] perspective-1000 mb-6 cursor-pointer" onClick={() => setFlipped(!flipped)}>
            <div className={`relative w-full h-full transform-style-3d ${flipped ? 'rotate-y-180' : ''}`}>
              <div className="absolute inset-0 w-full h-full backface-hidden bg-white border-2 border-slate-200 rounded-3xl shadow-lg flex flex-col justify-center items-center p-6">
                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">LATINSKY</span>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-800 text-center">{currentWord.latin}</h2>
                <span className="text-xs text-slate-400 mt-6 flex items-center gap-1"><RotateCcw className="w-3.5 h-3.5"/> Otočit</span>
              </div>
              <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-teal-900 border-2 border-teal-800 rounded-3xl shadow-lg flex flex-col justify-center items-center p-6 text-white">
                <span className="text-[10px] font-bold text-teal-300 uppercase tracking-widest mb-4">ČESKY</span>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-center">{currentWord.czech}</h2>
                <span className="text-xs text-teal-300 mt-6 flex items-center gap-1"><RotateCcw className="w-3.5 h-3.5"/> Otočit zpět</span>
              </div>
            </div>
          </div>

          <div className="flex gap-3 w-full">
            <button 
              onClick={() => handleAnswer(false)} 
              className="flex-1 py-4 bg-rose-50 text-rose-700 border border-rose-200 font-bold rounded-2xl hover:bg-rose-100 flex justify-center items-center gap-2 text-sm"
            >
              <XCircle className="w-5 h-5" /> Neznám
            </button>
            <button 
              onClick={() => handleAnswer(true)} 
              className="flex-1 py-4 bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold rounded-2xl hover:bg-emerald-100 flex justify-center items-center gap-2 text-sm"
            >
              <CheckCircle2 className="w-5 h-5" /> Znám
            </button>
          </div>
        </div>
      );
    }

    // --- DICTIONARY VIEW ---
    function DictionaryView() {
      return (
        <div className="max-w-4xl mx-auto bg-white p-6 rounded-2xl border shadow-sm">
          <h2 className="text-2xl font-bold mb-4">Slovník</h2>
          <ul className="divide-y text-sm">
            {vocabDatabase.map((item, idx) => (
              <li key={idx} className="py-2 flex justify-between">
                <span className="font-semibold text-slate-900">{item.latin}</span>
                <span className="text-teal-700">{item.czech}</span>
              </li>
            ))}
          </ul>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
