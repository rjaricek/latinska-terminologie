                                        React.createElement('div', {key: index, className: 'py-2 border-b border-slate-100 flex justify-between'},
                                            React.createElement('span', {className: 'font-semibold'}, item.latin),
                                            React.createElement('span', {className: 'text-teal-700'}, item.czech)
                                        )
                                    ))
                                )
                            )
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
