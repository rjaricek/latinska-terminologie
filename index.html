    function App() {
      const [currentSection, setCurrentSection] = useState('dashboard');
      const [activeTheoryChapter, setActiveTheoryChapter] = useState(theoryChapters[0].id);
      const [practiceMode, setPracticeMode] = useState('flashcards');
      const [practiceCategory, setPracticeCategory] = useState('Vše');
      const [dictCategory, setDictCategory] = useState('Vše');
      const [dictSearch, setDictSearch] = useState('');
      
      const [knownWords, setKnownWords] = useState({});

      useEffect(() => {
        const savedWords = localStorage.getItem('latinaKnownWords');
        if (savedWords) setKnownWords(JSON.parse(savedWords));
      }, []);

      const updateKnownWords = (word, isKnown) => {
        const updated = { ...knownWords, [word]: isKnown };
        setKnownWords(updated);
        localStorage.setItem('latinaKnownWords', JSON.stringify(updated));
      };

      const renderContent = () => {
        if (currentSection === 'dashboard') {
          return <Dashboard knownWords={knownWords} setSection={setCurrentSection} />;
        }
        if (currentSection === 'theory') {
          return <TheoryView activeChapter={activeTheoryChapter} setChapter={setActiveTheoryChapter} />;
        }
        if (currentSection === 'practice') {
          return (
            <PracticeView 
              mode={practiceMode} 
              setMode={setPracticeMode}
              category={practiceCategory}
              setCategory={setPracticeCategory}
              knownWords={knownWords}
              updateKnownWords={updateKnownWords}
            />
          );
        }
        if (currentSection === 'dictionary') {
          return (
            <DictionaryView 
              category={dictCategory}
              setCategory={setDictCategory}
              search={dictSearch}
              setSearch={setDictSearch}
            />
          );

    // --- FLASHCARDS MODULE ---
    function FlashcardsModule({ vocab, knownWords, updateKnownWords }) {
      const [shuffledVocab, setShuffledVocab] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      useEffect(() => {
        setShuffledVocab([...vocab].sort(() => 0.5 - Math.random()));
        setCurrentIndex(0);
        setIsFlipped(false);
      }, [vocab]);

      if (shuffledVocab.length === 0) return <div>Žádná slovíčka k dispozici.</div>;

      const word = shuffledVocab[currentIndex];
      const isKnown = knownWords[word.latin] === true;

      const handleNext = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex((prev) => (prev + 1) % shuffledVocab.length);
        }, 150);
      };

      const handlePrev = () => {
        setIsFlipped(false);
        setTimeout(() => {
          setCurrentIndex((prev) => (prev - 1 + shuffledVocab.length) % shuffledVocab.length);
        }, 150);
      };

      const markWord = (status) => {
        updateKnownWords(word.latin, status);
        handleNext();
      };

      return (
        <div className="flex flex-col items-center justify-center w-full max-w-lg">
          <div className="w-full flex justify-between items-center text-sm font-medium text-slate-400 mb-6">
            <span>Kartička {currentIndex + 1} z {shuffledVocab.length}</span>
            <span className="flex items-center gap-2">
              Stav: 
              {isKnown ? (
                <span className="text-emerald-600 flex items-center gap-1"><CheckCircle2 className="w-4 h-4"/> Znám</span>
              ) : knownWords[word.latin] === false ? (
                <span className="text-rose-500 flex items-center gap-1"><XCircle className="w-4 h-4"/> Neznám</span>
              ) : (
                <span>Neprohlédnuto</span>
              )}
            </span>
          </div>

          <div 
            className="w-full aspect-[3/2] perspective-1000 mb-10 cursor-pointer"
            onClick={() => setIsFlipped(!isFlipped)}
          >
            <div className={`relative w-full h-full transform-style-3d ${isFlipped ? 'rotate-y-180' : ''}`}>
              
              <div className="absolute inset-0 w-full h-full backface-hidden bg-white border-2 border-slate-200 rounded-3xl shadow-xl flex flex-col items-center justify-center p-8 hover:border-teal-300 transition-colors">
                <span className="absolute top-6 text-xs font-bold text-slate-300 uppercase tracking-widest">Latinský výraz</span>
                <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800 text-center">{word.latin}</h2>
                <p className="absolute bottom-6 text-sm text-slate-400 flex items-center gap-2">
                  <RotateCcw className="w-4 h-4" /> Kliknutím otoč
                </p>
              </div>

              <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-teal-900 border-2 border-teal-800 rounded-3xl shadow-xl flex flex-col items-center justify-center p-8">
                 <span className="absolute top-6 text-xs font-bold text-teal-300 uppercase tracking-widest">Český překlad</span>
                <h2 className="text-3xl md:text-4xl font-extrabold text-white text-center">{word.czech}</h2>
                 <p className="absolute bottom-6 text-sm text-teal-300 flex items-center gap-2">
                  <RotateCcw className="w-4 h-4" /> Kliknutím otoč zpět
                </p>
              </div>

            </div>
          </div>

          <div className="flex items-center gap-4 w-full">
            <button onClick={handlePrev} className="p-4 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors shadow-sm">
              <ChevronRight className="w-6 h-6 rotate-180" />
            </button>
            <button onClick={() => markWord(false)} className="flex-1 py-4 px-6 rounded-xl bg-rose-50 text-rose-700 font-bold border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm flex items-center justify-center gap-2">
              <XCircle className="w-5 h-5" /> Neznám
            </button>
            <button onClick={() => markWord(true)} className="flex-1 py-4 px-6 rounded-xl bg-emerald-50 text-emerald-700 font-bold border border-emerald-200 hover:bg-emerald-100 transition-colors shadow-sm flex items-center justify-center gap-2">
              <CheckCircle2 className="w-5 h-5" /> Znám
            </button>
            <button onClick={handleNext} className="p-4 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors shadow-sm">
              <ChevronRight className="w-6 h-6" />
            </button>
          </div>
        </div>
      );
    }

    // --- QUIZ MODULE ---
    function QuizModule({ vocab, allVocab }) {
      const [state, setState] = useState('start');
      const [questions, setQuestions] = useState([]);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);

      const startQuiz = () => {
        const limit = Math.min(15, vocab.length);
        const shuffled = [...vocab].sort(() => 0.5 - Math.random()).slice(0, limit);
        
        const generated = shuffled.map(correct => {
          const wrongOptions = allVocab
            .filter(w => w.czech !== correct.czech)
            .sort(() => 0.5 - Math.random())
            .slice(0, 3)
            .map(w => w.czech);
          
          const options = [correct.czech, ...wrongOptions].sort(() => 0.5 - Math.random());
          return { question: correct.latin, correctAnswer: correct.czech, options };
        });

        setQuestions(generated);
        setCurrentIdx(0);
        setScore(0);
        setSelectedAnswer(null);
        setState('playing');
      };

      const handleAnswer = (answer) => {
        if (selectedAnswer !== null) return; 
        setSelectedAnswer(answer);
        
        const isCorrect = answer === questions[currentIdx].correctAnswer;
        if (isCorrect) setScore(s => s + 1);

        setTimeout(() => {
          if (currentIdx + 1 < questions.length) {
            setCurrentIdx(c => c + 1);
            setSelectedAnswer(null);
          } else {
            setState('finished');
          }
        }, 1200);
      };

      if (state === 'start') {
        return (
          <div className="text-center">
            <div className="w-24 h-24 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center mx-auto mb-6">
              <CheckSquare className="w-12 h-12" />
            </div>
            <h2 className="text-2xl font-bold text-slate-900 mb-4">Ověřte své znalosti</h2>
            <p className="text-slate-600 mb-8 max-w-md mx-auto">Tento kvíz vybere náhodná slovíčka z vybrané lekce. Otestujte si paměť metodou Multiple-Choice.</p>
            <button onClick={startQuiz} className="px-8 py-4 bg-teal-600 text-white font-bold rounded-xl hover:bg-teal-700 transition-colors shadow-md">
              Spustit cvičení
            </button>
          </div>
        );
      }

      if (state === 'finished') {
        return (
          <div className="text-center">
            <div className="w-24 h-24 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
              <Trophy className="w-12 h-12" />
            </div>
            <h2 className="text-3xl font-bold text-slate-900 mb-2">Cvičení dokončeno!</h2>
            <p className="text-xl text-slate-600 mb-8">Váš výsledek: <span className="font-bold text-slate-900">{score} z {questions.length}</span></p>
            <button onClick={startQuiz} className="px-8 py-4 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-colors shadow-md">
              Nové cvičení
            </button>
          </div>
        );
      }

      const q = questions[currentIdx];

      return (
        <div className="max-w-2xl w-full">
          <div className="flex justify-between items-center mb-8 text-sm font-bold text-slate-400 uppercase tracking-widest">
            <span>Otázka {currentIdx + 1} / {questions.length}</span>
            <span>Skóre: {score}</span>
          </div>

          <div className="bg-white p-10 mb-8 rounded-xl border border-slate-200 shadow-md text-center">
            <span className="text-teal-600 font-medium text-sm mb-2 block">Přeložte z latiny do češtiny:</span>
            <h2 className="text-4xl font-extrabold text-slate-900">{q.question}</h2>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {q.options.map((opt, i) => {
              let btnClass = "bg-white border-2 border-slate-200 text-slate-700 hover:border-teal-400 hover:bg-teal-50";
              if (selectedAnswer !== null) {
                if (opt === q.correctAnswer) btnClass = "bg-emerald-50 border-2 border-emerald-500 text-emerald-800 font-bold shadow-md";
                else if (opt === selectedAnswer) btnClass = "bg-rose-50 border-2 border-rose-500 text-rose-800 font-bold shadow-md";
                else btnClass = "bg-white border-2 border-slate-100 text-slate-400 opacity-50";
              }
              return (
                <button key={i} onClick={() => handleAnswer(opt)} disabled={selectedAnswer !== null} className={`p-6 rounded-xl text-lg transition-all duration-200 text-left font-medium ${btnClass}`}>
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
