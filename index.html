    // --- FLASHCARDS MODULE S OPRAVENÝM PŘECHODEM KARTIČEK ---
    function FlashcardsModule({ vocab, knownWords, updateKnownWords, onFilterUnknown, resetFilter }) {
      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);
      const [sessionKnown, setSessionKnown] = useState([]);
      const [sessionUnknown, setSessionUnknown] = useState([]);
      const [isFinished, setIsFinished] = useState(false);

      useEffect(() => {
        setIdx(0);
        setFlipped(false);
        setSessionKnown([]);
        setSessionUnknown([]);
        setIsFinished(false);
      }, [vocab]);

      if (!vocab || vocab.length === 0) return <div className="p-8 text-center text-slate-500">Žádná slovíčka ve vybraných lekcích.</div>;

      const currentWord = vocab[idx];

      const handleAnswer = (e, isKnown) => {
        if (e) e.stopPropagation(); // Zamezí nechtěnému překlopení kartičky při stisku tlačítka
        updateKnownWords(currentWord.latin, isKnown);

        if (isKnown) {
          setSessionKnown(prev => [...prev.filter(w => w.latin !== currentWord.latin), currentWord]);
          setSessionUnknown(prev => prev.filter(w => w.latin !== currentWord.latin));
        } else {
          setSessionUnknown(prev => [...prev.filter(w => w.latin !== currentWord.latin), currentWord]);
          setSessionKnown(prev => prev.filter(w => w.latin !== currentWord.latin));
        }

        setFlipped(false);
        if (idx + 1 < vocab.length) {
          setIdx(prev => prev + 1);
        } else {
          setIsFinished(true);
        }
      };

      const handlePrev = (e) => {
        if (e) e.stopPropagation();
        if (idx > 0) {
          setFlipped(false);
          setIdx(prev => prev - 1);
        }
      };

      const restartAll = () => {
        resetFilter();
        setIdx(0);
        setFlipped(false);
        setSessionKnown([]);
        setSessionUnknown([]);
        setIsFinished(false);
      };

      // EVALUAČNÍ OBRAZOVKA PO DOKONČENÍ BALÍČKU
      if (isFinished) {
        return (
          <div className="max-w-md w-full bg-white p-8 rounded-3xl border shadow-md text-center space-y-6">
            <Trophy className="w-12 h-12 text-amber-500 mx-auto" />
            <h2 className="text-2xl font-bold text-slate-900">Procvičování dokončeno!</h2>

            <div className="grid grid-cols-2 gap-4">
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                <span className="block text-2xl font-extrabold text-emerald-700">{sessionKnown.length}</span>
                <span className="text-xs font-bold text-emerald-800 uppercase tracking-wider">Umím</span>
              </div>
              <div className="bg-rose-50 border border-rose-200 p-4 rounded-2xl">
                <span className="block text-2xl font-extrabold text-rose-700">{sessionUnknown.length}</span>
                <span className="text-xs font-bold text-rose-800 uppercase tracking-wider">Neumím</span>
              </div>
            </div>

            <div className="space-y-3 pt-2">
              {sessionUnknown.length > 0 && (
                <button 
                  onClick={() => onFilterUnknown(sessionUnknown)} 
                  className="w-full py-3.5 bg-rose-600 text-white font-bold rounded-xl shadow-md hover:bg-rose-700 transition"
                >
                  Procvičit pouze neznámá ({sessionUnknown.length})
                </button>
              )}
              <button 
                onClick={restartAll} 
                className="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl shadow-md hover:bg-slate-800 transition flex items-center justify-center gap-2"
              >
                <RefreshCw className="w-4 h-4" /> Spustit celou sérii znovu
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-lg w-full flex flex-col items-center">
          <div className="w-full flex justify-between items-center text-xs sm:text-sm text-slate-400 mb-4 px-2">
            <button 
              onClick={handlePrev} 
              disabled={idx === 0} 
              className={`flex items-center gap-1 font-semibold ${idx === 0 ? 'opacity-30 cursor-not-allowed' : 'hover:text-teal-600'}`}
            >
              <ChevronLeft className="w-4 h-4" /> Zpět
            </button>
            <span>Kartička {idx + 1} z {vocab.length}</span>
            <span>{knownWords[currentWord.latin] ? '✓ Znám' : 'Neprohlédnuto'}</span>
          </div>

          <div className="w-full aspect-[3/2] perspective-1000 mb-6 cursor-pointer" onClick={() => setFlipped(!flipped)}>
            <div className={`relative w-full h-full transform-style-3d ${flipped ? 'rotate-y-180' : ''}`}>
              <div className="absolute inset-0 w-full h-full backface-hidden bg-white border-2 border-slate-200 rounded-3xl shadow-lg flex flex-col justify-center items-center p-6">
                <span className="text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">LATINSKY</span>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-800 text-center">{currentWord.latin}</h2>
                <span className="text-xs text-slate-400 mt-6 flex items-center gap-1"><RotateCcw className="w-3.5 h-3.5"/> Kliknutím otoč</span>
              </div>
              <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-teal-900 border-2 border-teal-800 rounded-3xl shadow-lg flex flex-col justify-center items-center p-6 text-white">
                <span className="text-[10px] sm:text-xs font-bold text-teal-300 uppercase tracking-widest mb-4">ČESKY</span>
                <h2 className="text-2xl sm:text-3xl font-extrabold text-center">{currentWord.czech}</h2>
                <span className="text-xs text-teal-300 mt-6 flex items-center gap-1"><RotateCcw className="w-3.5 h-3.5"/> Kliknutím otoč zpět</span>
              </div>
            </div>
          </div>

          <div className="flex gap-3 w-full">
            <button onClick={(e) => handleAnswer(e, false)} className="flex-1 py-3.5 bg-rose-50 text-rose-700 border border-rose-200 font-bold rounded-2xl hover:bg-rose-100 flex justify-center items-center gap-1 text-sm">
              <XCircle className="w-4 h-4" /> Neznám
            </button>
            <button onClick={(e) => handleAnswer(e, true)} className="flex-1 py-3.5 bg-emerald-50 text-emerald-700 border border-emerald-200 font-bold rounded-2xl hover:bg-emerald-100 flex justify-center items-center gap-1 text-sm">
              <CheckCircle2 className="w-4 h-4" /> Znám
            </button>
          </div>
        </div>
      );
    }

    // --- QUIZ MODULE ---
    function QuizModule({ vocab, allVocab }) {
      const [started, setStarted] = useState(false);
      const [questions, setQuestions] = useState([]);
      const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0);
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [questionCount, setQuestionCount] = useState(10);

      const startQuiz = () => {
        let limit = questionCount === 'all' ? vocab.length : parseInt(questionCount);
        if (isNaN(limit) || limit > vocab.length) limit = vocab.length;
        if (limit < 1) limit = 1;

        const shuffled = [...vocab].sort(() => 0.5 - Math.random()).slice(0, limit);
        const generated = shuffled.map(correct => {
          const wrong = allVocab.filter(w => w.czech !== correct.czech).sort(() => 0.5 - Math.random()).slice(0, 3).map(w => w.czech);
          const options = [correct.czech, ...wrong].sort(() => 0.5 - Math.random());
          return { question: correct.latin, correctAnswer: correct.czech, options };
        });
        setQuestions(generated);
        setQIdx(0);
        setScore(0);
        setSelectedAnswer(null);
        setStarted(true);
      };

      const handleSelectOption = (opt) => {
        if (selectedAnswer !== null) return;
        setSelectedAnswer(opt);
        
        const isCorrect = opt === questions[qIdx].correctAnswer;
        if (isCorrect) {
          setScore(prev => prev + 1);
        }

        setTimeout(() => {
          setQIdx(prev => prev + 1);
          setSelectedAnswer(null);
        }, 1200);
      };

      if (!started) return (
        <div className="text-center p-6 md:p-8 bg-white rounded-2xl border max-w-md w-full shadow-sm">
          <CheckSquare className="w-12 h-12 text-teal-600 mx-auto mb-4" />
          <h3 className="text-xl font-bold text-slate-900 mb-2">Zkušební kvíz</h3>
          <p className="text-slate-500 text-sm mb-6">Testování z latinských slovíček a překladu do češtiny.</p>
          
          <div className="mb-6 text-left">
            <label className="block text-xs font-bold text-slate-600 uppercase mb-2">Počet otázek:</label>
            <div className="grid grid-cols-5 gap-2">
              {[5, 10, 15, 20, 'all'].map(num => (
                <button
                  key={num}
                  onClick={() => setQuestionCount(num)}
                  className={`py-2 rounded-xl text-sm font-bold border ${questionCount === num ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'}`}
                >
                  {num === 'all' ? 'Vše' : num}
                </button>
              ))}
            </div>
            <p className="text-xs text-slate-400 mt-2">Dostupných slovíček v lekci: {vocab.length}</p>
          </div>

          <button onClick={startQuiz} className="w-full py-3.5 bg-teal-600 text-white font-bold rounded-xl shadow-md hover:bg-teal-700 transition-colors">
            Spustit kvíz
          </button>
        </div>
      );

      if (qIdx >= questions.length) return (
        <div className="text-center p-8 bg-white rounded-2xl border max-w-md w-full shadow-sm">
          <Trophy className="w-12 h-12 text-amber-500 mx-auto mb-4" />
          <h2 className="text-2xl font-bold mb-2">Cvičení dokončeno!</h2>
          <p className="text-lg text-slate-600 mb-6">Váš výsledek: <span className="font-bold text-slate-900">{score} z {questions.length}</span> ({Math.round((score/questions.length)*100)}%)</p>
          <button onClick={() => setStarted(false)} className="w-full py-3.5 bg-slate-900 text-white font-bold rounded-xl hover:bg-slate-800 transition-colors">Spustit nový kvíz</button>
        </div>
      );

      const q = questions[qIdx];
      return (
        <div className="max-w-md w-full space-y-4">
          <div className="flex justify-between text-xs font-bold text-slate-400 uppercase">
            <span>Otázka {qIdx + 1} / {questions.length}</span>
            <span>Skóre: {score}</span>
          </div>

          <div className="bg-white p-6 rounded-2xl border shadow-sm text-center">
            <span className="text-xs text-teal-600 font-semibold mb-1 block">Přeložte z latiny do češtiny:</span>
            <h2 className="text-2xl sm:text-3xl font-extrabold text-slate-900">{q.question}</h2>
          </div>

          <div className="grid grid-cols-1 gap-2.5">
            {q.options.map((opt, i) => {
              let btnStyle = "bg-white border-2 border-slate-200 text-slate-700 hover:border-teal-400";
              
              if (selectedAnswer !== null) {
                if (opt === q.correctAnswer) {
                  btnStyle = "bg-emerald-500 border-2 border-emerald-600 text-white font-bold shadow-md";
                } else if (opt === selectedAnswer) {
                  btnStyle = "bg-rose-500 border-2 border-rose-600 text-white font-bold shadow-md";
                } else {
                  btnStyle = "bg-slate-50 border-2 border-slate-100 text-slate-300 opacity-50";
                }
              }

              return (
                <button 
                  key={i} 
                  onClick={() => handleSelectOption(opt)} 
                  disabled={selectedAnswer !== null} 
                  className={`p-4 rounded-xl text-base text-left font-medium transition-all ${btnStyle}`}
                >
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
