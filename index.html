          </header>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-gradient-to-br from-teal-900 to-slate-800 text-white p-6 rounded-xl shadow-md flex flex-col justify-between">
              <div className="flex items-center gap-4 mb-6">
                <BrainCircuit className="w-10 h-10 text-teal-400" />
                <div>
                  <h3 className="text-lg font-semibold text-slate-200">Zvládnutá slovíčka</h3>
                  <p className="text-3xl font-bold">{learnedWords} / {totalWords}</p>
                </div>
              </div>
              <div className="w-full bg-slate-700 rounded-full h-2.5">
                <div className="bg-teal-400 h-2.5 rounded-full" style={{ width: `${progressPercent}%` }}></div>
              </div>
            </div>

            <div className="bg-white p-6 rounded-xl border shadow-sm space-y-3">
              <h3 className="text-lg font-bold">Rychlý rozcestník</h3>
              <button onClick={() => setSection('theory')} className="w-full p-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-left font-medium flex justify-between">Teorie a tabulky <ChevronRight /></button>
              <button onClick={() => setSection('dictionary')} className="w-full p-3 bg-slate-100 hover:bg-slate-200 rounded-lg text-left font-medium flex justify-between">Kompletní slovníček <ChevronRight /></button>
              <button onClick={() => setSection('practice')} className="w-full p-3 bg-teal-50 hover:bg-teal-100 text-teal-800 rounded-lg text-left font-medium flex justify-between">Kartičky a Kvíz <ChevronRight /></button>
            </div>
          </div>
        </div>
      );
    }

    // --- THEORY VIEW ---
    function TheoryView({ activeChapter, setChapter }) {
      const activeContent = theoryChapters.find(c => c.id === activeChapter);
      return (
        <div className="flex h-full">
          <div className="w-1/3 max-w-sm border-r bg-white p-4 space-y-1">
            <h2 className="text-xl font-bold p-2 mb-2">Teorie & Tabulky</h2>
            {theoryChapters.map(ch => (
              <button key={ch.id} onClick={() => setChapter(ch.id)} className={`w-full text-left p-3 rounded-lg text-sm ${activeChapter === ch.id ? 'bg-teal-50 text-teal-800 font-bold' : 'hover:bg-slate-50'}`}>
                {ch.title}
              </button>
            ))}
          </div>
          <div className="flex-1 p-8 overflow-y-auto">
            <div className="max-w-3xl mx-auto bg-white p-8 rounded-2xl border shadow-sm">
              <h1 className="text-2xl font-bold mb-6 border-b pb-4">{activeContent?.title}</h1>
              {activeContent?.content}
            </div>
          </div>
        </div>
      );
    }

    // --- DICTIONARY VIEW ---
    function DictionaryView({ category, setCategory, search, setSearch }) {
      const categories = ['Vše', ...new Set(vocabDatabase.map(v => v.cat))];
      const filtered = vocabDatabase.filter(v => {
        const matchesCat = category === 'Vše' || v.cat === category;
        const matchesSearch = v.latin.toLowerCase().includes(search.toLowerCase()) || v.czech.toLowerCase().includes(search.toLowerCase());
        return matchesCat && matchesSearch;
      });

      return (
        <div className="p-8 max-w-5xl mx-auto space-y-6">
          <div className="flex justify-between items-center gap-4">
            <h2 className="text-3xl font-bold">Slovníček ({filtered.length})</h2>
            <div className="flex gap-3">
              <input type="text" placeholder="Hledat..." value={search} onChange={e => setSearch(e.target.value)} className="p-2 border rounded-lg" />
              <select value={category} onChange={e => setCategory(e.target.value)} className="p-2 border rounded-lg">
                {categories.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>
          <div className="bg-white rounded-xl border overflow-hidden shadow-sm">
            <table className="w-full text-left border-collapse">
              <thead><tr className="bg-slate-100 border-b"><th className="p-4">Latina</th><th className="p-4">Česky</th><th className="p-4">Lekce</th></tr></thead>
              <tbody className="divide-y">
                {filtered.map((item, idx) => (
                  <tr key={idx} className="hover:bg-slate-50"><td className="p-4 font-semibold">{item.latin}</td><td className="p-4 text-teal-700">{item.czech}</td><td className="p-4 text-xs text-slate-500">{item.cat}</td></tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- SOURCES VIEW ---
    function SourcesView() {
      return (
        <div className="p-8 max-w-3xl mx-auto space-y-6">
          <h2 className="text-3xl font-bold">Zdroje a Literatura</h2>
          <div className="bg-white p-8 rounded-xl border space-y-4">
            <h3 className="font-bold text-lg text-teal-800">Úvod do latinské terminologie</h3>
            <p><strong>Autorka:</strong> PhDr. Vlasta Seinerová</p>
            <p><strong>Vydavatel:</strong> Univerzita Pardubice, Fakulta zdravotnických studií</p>
            <p><strong>ISBN:</strong> 978-80-7560-589-4</p>
          </div>
        </div>
      );
    }

    // --- PRACTICE VIEW ---
    function PracticeView({ mode, setMode, category, setCategory, knownWords, updateKnownWords }) {
      const categories = ['Vše', ...new Set(vocabDatabase.map(v => v.cat))];
      const activeVocab = getVocabByCategory(category);

      return (
        <div className="p-8 flex flex-col items-center">
          <div className="flex justify-between w-full max-w-xl mb-8 bg-white p-2 rounded-xl border">
            <div className="space-x-2">
              <button onClick={() => setMode('flashcards')} className={`px-4 py-2 rounded-lg font-medium ${mode === 'flashcards' ? 'bg-teal-600 text-white' : 'bg-slate-100'}`}>Kartičky</button>
              <button onClick={() => setMode('quiz')} className={`px-4 py-2 rounded-lg font-medium ${mode === 'quiz' ? 'bg-teal-600 text-white' : 'bg-slate-100'}`}>Kvíz</button>
            </div>
            <select value={category} onChange={e => setCategory(e.target.value)} className="p-2 border rounded-lg text-sm">
              {categories.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>

          {mode === 'flashcards' ? (
            <FlashcardsModule vocab={activeVocab} knownWords={knownWords} updateKnownWords={updateKnownWords} />
          ) : (
            <QuizModule vocab={activeVocab} allVocab={vocabDatabase} />
          )}
        </div>
      );
    }

    // --- FLASHCARDS MODULE WITH 3D FLIP ---
    function FlashcardsModule({ vocab, knownWords, updateKnownWords }) {
      const [idx, setIdx] = useState(0);
      const [flipped, setFlipped] = useState(false);

      if (!vocab || vocab.length === 0) return <div>Žádná slovíčka v této lekci.</div>;
      const w = vocab[idx % vocab.length];

      return (
        <div className="max-w-lg w-full flex flex-col items-center">
          <div className="w-full flex justify-between text-sm text-slate-400 mb-4">
            <span>Kartička {idx + 1} z {vocab.length}</span>
            <span>{knownWords[w.latin] ? '✓ Znám' : 'Neprohlédnuto'}</span>
          </div>

          <div className="w-full aspect-[3/2] perspective-1000 mb-8 cursor-pointer" onClick={() => setFlipped(!flipped)}>
            <div className={`relative w-full h-full transform-style-3d ${flipped ? 'rotate-y-180' : ''}`}>
              <div className="absolute inset-0 w-full h-full backface-hidden bg-white border-2 rounded-3xl shadow-lg flex flex-col justify-center items-center p-8">
                <span className="text-xs font-bold text-slate-400 uppercase mb-4">LATINSKY</span>
                <h2 className="text-3xl font-extrabold text-slate-800 text-center">{w.latin}</h2>
              </div>
              <div className="absolute inset-0 w-full h-full backface-hidden rotate-y-180 bg-teal-900 border-2 rounded-3xl shadow-lg flex flex-col justify-center items-center p-8 text-white">
                <span className="text-xs font-bold text-teal-300 uppercase mb-4">ČESKY</span>
                <h2 className="text-3xl font-extrabold text-center">{w.czech}</h2>
              </div>
            </div>
          </div>

          <div className="flex gap-4 w-full">
            <button onClick={() => { updateKnownWords(w.latin, false); setIdx((idx + 1) % vocab.length); setFlipped(false); }} className="flex-1 py-4 bg-rose-100 text-rose-700 font-bold rounded-xl hover:bg-rose-200">Neznám</button>
            <button onClick={() => { updateKnownWords(w.latin, true); setIdx((idx + 1) % vocab.length); setFlipped(false); }} className="flex-1 py-4 bg-emerald-100 text-emerald-700 font-bold rounded-xl hover:bg-emerald-200">Znám</button>
          </div>
        </div>
      );
    }

    // --- QUIZ MODULE ---
    function QuizModule({ vocab, allVocab }) {
      const [started, setStarted] = useState(false);
      const [questions, setQuestions] = useState([]);
      const [qIdx, setQIdx] = useState(0);
      const [score, setScore] = useState(0);

      const startQuiz = () => {
        const limit = Math.min(10, vocab.length);
        const shuffled = [...vocab].sort(() => 0.5 - Math.random()).slice(0, limit);
        const generated = shuffled.map(correct => {
          const wrong = allVocab.filter(w => w.czech !== correct.czech).sort(() => 0.5 - Math.random()).slice(0, 3).map(w => w.czech);
          const options = [correct.czech, ...wrong].sort(() => 0.5 - Math.random());
          return { question: correct.latin, correctAnswer: correct.czech, options };
        });
        setQuestions(generated);
        setQIdx(0);
        setScore(0);
        setStarted(true);
      };

      if (!started) return <button onClick={startQuiz} className="px-8 py-4 bg-teal-600 text-white font-bold rounded-xl shadow-md">Spustit Kvíz (10 otázek)</button>;
      if (qIdx >= questions.length) return <div className="text-center"><h2 className="text-3xl font-bold mb-4">Konec kvízu!</h2><p className="text-xl mb-6">Skóre: {score} z {questions.length}</p><button onClick={startQuiz} className="px-6 py-3 bg-slate-900 text-white font-bold rounded-xl">Hrát znovu</button></div>;

      const q = questions[qIdx];
      return (
        <div className="max-w-md w-full text-center space-y-6">
          <h3 className="text-2xl font-bold">Přeložte: {q.question}</h3>
          <div className="grid grid-cols-1 gap-3">
            {q.options.map((opt, i) => (
              <button key={i} onClick={() => { if(opt === q.correctAnswer) setScore(s=>s+1); setQIdx(qIdx+1); }} className="p-4 bg-white border-2 rounded-xl text-left font-medium hover:border-teal-500">{opt}</button>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
